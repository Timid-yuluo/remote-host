name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: 一致性检查
        run: npm run lint
      - name: 单元与集成测试
        run: npm test
      - name: SSH 端到端测试
        run: npm run test:e2e
